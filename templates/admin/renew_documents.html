{% extends "admin/admin_base.html" %}

{% block admin_title %}Renew Document{% endblock %}

{% block admin_content %}
<div class="max-w-md mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Renew Document</h1>
        <a href="{{ url_for('admin_user_documents', user_id=user_id) }}" class="text-blue-600 hover:underline">← Back</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6">
        <div class="mb-4">
            <p class="text-sm text-gray-500">Document</p>
            <p class="font-medium">{{ doc[0] }}</p>
        </div>
        <div class="mb-6">
            <p class="text-sm text-gray-500">Current Expiry</p>
            <p class="font-medium">{{ doc[1] }}</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label for="expiry_date" class="block text-sm font-medium text-gray-700 mb-1">New Expiry Date *</label>
                <input type="date" id="expiry_date" name="expiry_date" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-medium">
                🔄 Renew Document
            </button>
        </form>
    </div>
</div>
{% endblock %}
