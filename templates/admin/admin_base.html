{% extends "base.html" %}

{% block title %}Admin - {% block admin_title %}{% endblock %}{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Admin mode indicator (visible on desktop) -->
    <div class="hidden sm:flex items-center gap-2 mb-4 text-sm text-purple-600">
        <span class="font-medium">⚙️ Admin Mode</span>
        <span class="text-gray-300">|</span>
        <span class="text-gray-500">You're in the admin dashboard</span>
    </div>
    
    {% block admin_content %}{% endblock %}
</div>
{% endblock %}
