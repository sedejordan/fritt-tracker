{% extends "base.html" %}
{% block title %}Renew Document — Fritt Tracker{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto mt-4 bg-white border border-line rounded-xl p-8 shadow-sm">
  <h2 class="font-display font-bold text-xl mb-2">Renew Document</h2>
  <p class="text-muted text-sm mb-6">
    <strong>{{ doc.title }}</strong> — current expiry: {{ doc.expiry_date }}
  </p>

  {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-3 py-2 mb-4">{{ error }}</div>
  {% endif %}

  <form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="expiry_date" class="block text-sm font-medium mb-1">New Expiry Date</label>
      <input type="date" id="expiry_date" name="expiry_date" required
             class="w-full px-3 py-2 border border-line rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fritt focus:border-transparent">
    </div>
    <div class="flex gap-2">
      <button type="submit" class="px-4 py-2 rounded-md bg-fritt text-white font-medium text-sm hover:bg-fritt-dark transition-colors">
        ✅ Confirm Renewal
      </button>
      <a href="/" class="px-4 py-2 rounded-md border border-line text-sm hover:bg-paper transition-colors">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
