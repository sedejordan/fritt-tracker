{% extends "base.html" %}
{% block title %}Feedback - Fritt Tracker{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
  <div class="bg-white border border-line rounded-xl p-8 shadow-sm">
    <h1 class="font-display font-bold text-2xl mb-2">Send Feedback</h1>
    <p class="text-muted text-sm mb-6">Help make Fritt Tracker better! What do you like? What needs work?</p>

    {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-3 py-2 mb-4">{{ error }}</div>
    {% endif %}    
    <form action="{{ url_for('contact') }}" method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="inquiry_type" value="feedback">
      <input type="hidden" name="subject" value="Feedback from Fritt Tracker">
      <div>
        <label for="name" class="block text-sm font-medium mb-1">Your Name</label>
        <input type="text" id="name" name="name" required
               class="w-full px-3 py-2 border border-line rounded-md focus:outline-none focus:ring-2 focus:ring-fritt">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium mb-1">Your Email</label>
        <input type="email" id="email" name="email" required
               class="w-full px-3 py-2 border border-line rounded-md focus:outline-none focus:ring-2 focus:ring-fritt">
      </div>
      <div>
        <label for="message" class="block text-sm font-medium mb-1">Feedback</label>
        <textarea id="message" name="message" rows="5" required
                  placeholder="What do you like? What's confusing? What features do you want?"
                  class="w-full px-3 py-2 border border-line rounded-md focus:outline-none focus:ring-2 focus:ring-fritt"></textarea>
      </div>
      <button type="submit" class="w-full py-2 rounded-md bg-fritt text-white font-medium hover:bg-fritt-dark transition-colors">
        Send Feedback
      </button>
    </form>
    
    <p class="text-center text-xs text-muted mt-4">
      All feedback is read and appreciated! 🙏
    </p>
  </div>
</div>

{% endblock %}
