{% extends "base.html" %}
{% block title %}Too Many Requests | Fritt Tracker{% endblock %}
{% block content %}

<div class="bg-white border border-line rounded-xl py-20 px-6 text-center">
  <div class="max-w-md mx-auto">
    <div class="text-8xl mb-4">⏳</div>
    <h1 class="text-2xl font-display font-bold text-ink mb-4">Too Many Requests</h1>
    <p class="text-muted mb-4">{{ error_message|default("You've made too many requests in a short period.") }}</p>
    <p class="text-muted text-sm mb-8">Please wait a moment before trying again.</p>
    
    <a href="/" class="px-6 py-3 rounded-md bg-fritt text-white font-medium hover:bg-fritt-dark transition-colors">
      Go Home
    </a>
  </div>
</div>

{% endblock %}
