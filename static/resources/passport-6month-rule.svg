<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ppTitle ppDesc">
  <title id="ppTitle">The passport 6-month validity rule</title>
  <desc id="ppDesc">A timeline showing a passport needs at least 6 months of validity beyond a traveler's return date to be accepted by most countries.</desc>
  <rect width="700" height="260" fill="#F7F7F5"/>

  <line x1="60" y1="140" x2="640" y2="140" stroke="#E4E4E1" stroke-width="3"/>

  <!-- today -->
  <circle cx="90" cy="140" r="7" fill="#6B7280"/>
  <text x="90" y="120" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Today</text>

  <!-- return date -->
  <circle cx="300" cy="140" r="8" fill="#14181F"/>
  <text x="300" y="120" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Your return date</text>

  <!-- required validity zone -->
  <rect x="300" y="132" width="230" height="16" fill="#22D3C9" opacity="0.35"/>
  <text x="415" y="175" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">6 months minimum validity required</text>

  <!-- safe expiry -->
  <circle cx="530" cy="140" r="9" fill="#2C5FEF"/>
  <text x="530" y="120" font-family="Inter, sans-serif" font-size="13" fill="#2C5FEF" text-anchor="middle" font-weight="700">Passport expiry</text>
  <text x="530" y="195" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Must fall after this line</text>

  <!-- danger zone -->
  <rect x="300" y="132" width="0" height="16" fill="none"/>
  <rect x="530" y="132" width="60" height="16" fill="#EF4444" opacity="0.15"/>

  <rect x="150" y="24" width="400" height="46" rx="8" fill="#FFFFFF" stroke="#E4E4E1" stroke-width="1.5"/>
  <text x="350" y="52" font-family="ui-monospace, monospace" font-size="14" fill="#1E46C4" text-anchor="middle" font-weight="600">Under 6 months validity = treated as expired</text>
</svg>
