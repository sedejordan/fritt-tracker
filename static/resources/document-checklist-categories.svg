<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dcTitle dcDesc">
  <title id="dcTitle">Four categories of documents to track</title>
  <desc id="dcDesc">Four cards representing personal documents, business and compliance documents, financial and insurance documents, and digital assets.</desc>
  <rect width="700" height="200" fill="#F7F7F5"/>

  <!-- card 1 -->
  <rect x="30" y="30" width="145" height="140" rx="12" fill="#FFFFFF" stroke="#E4E4E1" stroke-width="1.5"/>
  <text x="102" y="80" font-family="Inter, sans-serif" font-size="34" text-anchor="middle">👤</text>
  <text x="102" y="115" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="700">Personal</text>
  <text x="102" y="133" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Passports, IDs,</text>
  <text x="102" y="147" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">licenses</text>

  <!-- card 2 -->
  <rect x="188" y="30" width="145" height="140" rx="12" fill="#FFFFFF" stroke="#E4E4E1" stroke-width="1.5"/>
  <text x="260" y="80" font-family="Inter, sans-serif" font-size="34" text-anchor="middle">🏢</text>
  <text x="260" y="115" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="700">Business</text>
  <text x="260" y="133" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Permits, licenses,</text>
  <text x="260" y="147" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">inspections</text>

  <!-- card 3 -->
  <rect x="346" y="30" width="145" height="140" rx="12" fill="#FFFFFF" stroke="#E4E4E1" stroke-width="1.5"/>
  <text x="418" y="80" font-family="Inter, sans-serif" font-size="34" text-anchor="middle">💰</text>
  <text x="418" y="115" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="700">Financial</text>
  <text x="418" y="133" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Insurance,</text>
  <text x="418" y="147" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">contracts</text>

  <!-- card 4 -->
  <rect x="504" y="30" width="166" height="140" rx="12" fill="#FFFFFF" stroke="#E4E4E1" stroke-width="1.5"/>
  <text x="587" y="80" font-family="Inter, sans-serif" font-size="34" text-anchor="middle">💻</text>
  <text x="587" y="115" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="700">Digital</text>
  <text x="587" y="133" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Domains, SaaS,</text>
  <text x="587" y="147" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">certificates</text>
</svg>
