<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lrTitle lrDesc">
  <title id="lrTitle">The 4-step system for tracking license renewals</title>
  <desc id="lrDesc">Four connected steps: inventory every license, record the expiration date, set multiple reminders, and keep records centralized.</desc>
  <rect width="700" height="220" fill="#F7F7F5"/>

  <!-- connecting line -->
  <line x1="105" y1="90" x2="595" y2="90" stroke="#E4E4E1" stroke-width="3"/>

  <!-- step 1 -->
  <circle cx="105" cy="90" r="34" fill="#2C5FEF"/>
  <text x="105" y="98" font-family="Space Grotesk, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
  <text x="105" y="150" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Inventory</text>
  <text x="105" y="168" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">every license</text>

  <!-- step 2 -->
  <circle cx="270" cy="90" r="34" fill="#2C5FEF"/>
  <text x="270" y="98" font-family="Space Grotesk, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
  <text x="270" y="150" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Record expiry</text>
  <text x="270" y="168" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">not renewal date</text>

  <!-- step 3 -->
  <circle cx="435" cy="90" r="34" fill="#2C5FEF"/>
  <text x="435" y="98" font-family="Space Grotesk, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
  <text x="435" y="150" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Set reminders</text>
  <text x="435" y="168" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">at multiple intervals</text>

  <!-- step 4 -->
  <circle cx="595" cy="90" r="34" fill="#1E46C4"/>
  <text x="595" y="98" font-family="Space Grotesk, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
  <text x="595" y="150" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Centralize</text>
  <text x="595" y="168" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">in one shared place</text>
</svg>
