<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crTitle crDesc">
  <title id="crTitle">Contract cancellation deadline timeline</title>
  <desc id="crDesc">A timeline showing that the cancellation deadline falls before the contract end date, separated by the notice period.</desc>
  <rect width="700" height="260" fill="#F7F7F5"/>

  <!-- baseline -->
  <line x1="60" y1="150" x2="640" y2="150" stroke="#E4E4E1" stroke-width="3"/>

  <!-- start point -->
  <circle cx="90" cy="150" r="7" fill="#6B7280"/>
  <text x="90" y="130" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Contract signed</text>

  <!-- cancellation deadline -->
  <circle cx="430" cy="150" r="9" fill="#2C5FEF"/>
  <text x="430" y="126" font-family="Inter, sans-serif" font-size="14" fill="#2C5FEF" text-anchor="middle" font-weight="700">Cancellation deadline</text>
  <text x="430" y="184" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Track this date</text>

  <!-- end date -->
  <circle cx="610" cy="150" r="7" fill="#14181F"/>
  <text x="610" y="130" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Contract end date</text>
  <text x="610" y="184" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Most people track this</text>

  <!-- notice period bracket -->
  <line x1="430" y1="205" x2="610" y2="205" stroke="#22D3C9" stroke-width="3"/>
  <line x1="430" y1="198" x2="430" y2="212" stroke="#22D3C9" stroke-width="3"/>
  <line x1="610" y1="198" x2="610" y2="212" stroke="#22D3C9" stroke-width="3"/>
  <text x="520" y="228" font-family="Inter, sans-serif" font-size="13" fill="#14181F" text-anchor="middle" font-weight="600">Notice period (30-90 days)</text>

  <!-- formula box -->
  <rect x="150" y="30" width="400" height="46" rx="8" fill="#FFFFFF" stroke="#E4E4E1" stroke-width="1.5"/>
  <text x="350" y="58" font-family="ui-monospace, monospace" font-size="15" fill="#1E46C4" text-anchor="middle" font-weight="600">Cancellation deadline = End date − Notice period</text>
</svg>
